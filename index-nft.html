<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR.js NFT Video Tracker</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
    >
      <!-- Assets -->
      <a-assets>
        <video
          id="demo-video"
          src="assets/vid.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
          muted
          loop
        ></video>
      </a-assets>

      <!-- NFT Marker - replace 'assets/nft-marker' with your NFT descriptor path -->
      <a-nft
        type="nft"
        url="assets/nft-marker"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <a-plane
          material="src: #demo-video; opacity: 1"
          width="2"
          height="1"
          rotation="-90 0 0"
          position="0 0 0"
        ></a-plane>
      </a-nft>

      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Wait for scene to load
      document.querySelector("a-scene").addEventListener("loaded", function () {
        const nftMarker = document.querySelector("a-nft");
        const video = document.querySelector("#demo-video");

        if (nftMarker && video) {
          nftMarker.addEventListener("markerFound", () => {
            console.log("NFT Marker found");
            video.play().catch((err) => console.log("Play error:", err));
          });

          nftMarker.addEventListener("markerLost", () => {
            console.log("NFT Marker lost");
            video.pause();
          });
        }
      });
    </script>
  </body>
</html>
