<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js Video on Marker</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <a-video
          src="#demo-video"
          width="2"
          height="1"
          rotation="-90 0 0"
          position="0 0 0"
          autoplay="true"
          loop="true"
        ></a-video>
      </a-marker>

      <a-entity camera></a-entity>

      <a-assets>
        <video
          id="demo-video"
          src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r146/examples/textures/sintel.mp4"
          preload="auto"
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
          muted
        ></video>
      </a-assets>
    </a-scene>
  </body>
</html>
