<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Image Tracker</title>

    <!-- Correct A-Frame and MindAR versions -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #phone-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        justify-content: center;
        align-items: center;
      }

      #phone-modal.show {
        display: flex;
      }

      .modal-content {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #333;
        text-align: center;
      }

      .modal-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .modal-input {
        padding: 0.75rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s;
      }

      .modal-input:focus {
        outline: none;
        border-color: #4a90e2;
      }

      .modal-button {
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .modal-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .modal-button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      mindar-image="imageTargetSrc: assets/target.mind; uiScanning: false;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="demo-image" src="assets/image.png" crossorigin="anonymous" />
      </a-assets>

      <!-- Image Target -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-image
          id="image-plane"
          src="#demo-image"
          width="1"
          height="1"
          position="0 0 0"
          rotation="0 0 0"
        ></a-image>
      </a-entity>

      <!-- MindAR Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <!-- Phone Number Modal -->
    <div id="phone-modal">
      <div class="modal-content">
        <h2 class="modal-title">
          Enter your phone number to join the lucky draw
        </h2>
        <form class="modal-form" id="phone-form">
          <input
            type="tel"
            id="phone-input"
            class="modal-input"
            placeholder="Enter your phone number"
            required
            pattern="[0-9+\-\s()]+"
          />
          <button type="submit" class="modal-button">Submit</button>
        </form>
      </div>
    </div>

    <script>
      const target = document.querySelector("[mindar-image-target]");
      const imagePlane = document.querySelector("#image-plane");
      const sceneEl = document.querySelector("a-scene");
      const image = document.querySelector("#demo-image");

      // Adjust image size to fit the target while maintaining aspect ratio
      function adjustImageSize() {
        const updateSize = () => {
          if (image.naturalWidth > 0 && image.naturalHeight > 0) {
            const imageAspectRatio = image.naturalWidth / image.naturalHeight;
            const targetSize = 1; // MindAR default target size is 1 unit

            // Fit image within target bounds, maintaining aspect ratio
            let width, height;
            if (imageAspectRatio > 1) {
              // Landscape image
              width = targetSize;
              height = targetSize / imageAspectRatio;
            } else {
              // Portrait or square image
              width = targetSize * imageAspectRatio;
              height = targetSize;
            }

            imagePlane.setAttribute("width", width);
            imagePlane.setAttribute("height", height);
          }
        };

        // Try immediately if dimensions are available
        if (image.naturalWidth > 0 && image.naturalHeight > 0) {
          updateSize();
        } else {
          // Wait for image to load
          image.addEventListener("load", updateSize, { once: true });
        }
      }

      // Request higher quality camera for better tracking
      function requestHighQualityCamera() {
        const mindARSystem = sceneEl.systems["mindar-image-system"];
        if (mindARSystem && mindARSystem.video) {
          const stream = mindARSystem.video.srcObject;
          if (stream && stream.getVideoTracks().length > 0) {
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();

            const constraints = {
              width: { ideal: 1920, max: capabilities.width?.max || 1920 },
              height: { ideal: 1080, max: capabilities.height?.max || 1080 },
              frameRate: { ideal: 60, max: capabilities.frameRate?.max || 60 },
              facingMode: { ideal: "environment" },
            };

            track
              .applyConstraints(constraints)
              .then(() => {
                console.log("Camera quality improved:", constraints);
              })
              .catch((err) => {
                console.log("Could not apply camera constraints:", err);
              });
          }
        }
      }

      // Wait for MindAR to initialize
      sceneEl.addEventListener("renderstart", () => {
        setTimeout(requestHighQualityCamera, 1000);
        adjustImageSize();

        // Show modal when marker is detected (optional - you can remove this if not needed)
        target.addEventListener("targetFound", () => {
          console.log("Marker found");
        });

        target.addEventListener("targetLost", () => {
          console.log("Marker lost");
        });
      });

      // Modal functionality
      const phoneModal = document.getElementById("phone-modal");
      const phoneForm = document.getElementById("phone-form");
      const phoneInput = document.getElementById("phone-input");

      function showPhoneModal() {
        phoneModal.classList.add("show");
        phoneInput.focus();
      }

      function hidePhoneModal() {
        phoneModal.classList.remove("show");
      }

      phoneForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const phoneNumber = phoneInput.value.trim();

        if (phoneNumber) {
          console.log("Phone number submitted:", phoneNumber);
          // Here you can add your API call to submit the phone number
          // For example: submitPhoneNumber(phoneNumber);

          alert(
            `Thank you! Your phone number ${phoneNumber} has been submitted.`
          );
          hidePhoneModal();
          phoneInput.value = "";
        }
      });

      // Close modal when clicking outside
      phoneModal.addEventListener("click", (e) => {
        if (e.target === phoneModal) {
          hidePhoneModal();
        }
      });
    </script>
  </body>
</html>
