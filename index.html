<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Video Tracker</title>

    <!-- Correct A-Frame and MindAR versions -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      mindar-image="imageTargetSrc: assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="demo-video"
          src="assets/vid.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
          muted
          loop
        ></video>
      </a-assets>

      <!-- Image Target -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="video-plane"
          src="#demo-video"
          width="2"
          height="1"
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

      <!-- MindAR Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const video = document.querySelector("#demo-video");
      const target = document.querySelector("[mindar-image-target]");
      const sceneEl = document.querySelector("a-scene");

      // Wait for MindAR to initialize
      sceneEl.addEventListener("renderstart", () => {
        // Play video when marker is detected
        target.addEventListener("targetFound", () => {
          console.log("Marker found");
          video.play().catch((err) => console.error(err));
        });

        // Pause video when marker is lost
        target.addEventListener("targetLost", () => {
          console.log("Marker lost");
          video.pause();
        });
      });
    </script>
  </body>
</html>
