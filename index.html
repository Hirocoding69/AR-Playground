<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Video Tracker Optimized</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      mindar-image="imageTargetSrc: assets/target.mind; uiScanning: false;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="demo-video"
          src="assets/vid.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <!-- Image Target -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="video-plane"
          src="#demo-video"
          width="1"
          height="0.5625"
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const video = document.querySelector("#demo-video");
      const videoPlane = document.querySelector("#video-plane");
      const target = document.querySelector("[mindar-image-target]");
      const sceneEl = document.querySelector("a-scene");

      // Smooth tracking setup
      let lastPosition = new THREE.Vector3();
      let lastRotation = new THREE.Euler();

      // Adjust video size based on aspect ratio
      function adjustVideoSize() {
        const updateSize = () => {
          if (video.videoWidth && video.videoHeight) {
            const aspect = video.videoWidth / video.videoHeight;
            const targetSize = 1;
            let width, height;

            if (aspect > 1) {
              width = targetSize;
              height = targetSize / aspect;
            } else {
              width = targetSize * aspect;
              height = targetSize;
            }

            videoPlane.setAttribute("width", width);
            videoPlane.setAttribute("height", height);
          }
        };

        if (video.videoWidth && video.videoHeight) updateSize();
        else {
          video.addEventListener("loadedmetadata", updateSize, { once: true });
          video.addEventListener("canplay", updateSize, { once: true });
        }
      }

      // Request higher-quality camera
      function requestHighQualityCamera() {
        const mindARSystem = sceneEl.systems["mindar-image-system"];
        if (!mindARSystem || !mindARSystem.video) return;

        const stream = mindARSystem.video.srcObject;
        if (!stream) return;

        const track = stream.getVideoTracks()[0];
        const capabilities = track.getCapabilities();
        const constraints = {
          width: { ideal: 1920, max: capabilities.width?.max || 1920 },
          height: { ideal: 1080, max: capabilities.height?.max || 1080 },
          frameRate: { ideal: 60, max: capabilities.frameRate?.max || 60 },
          facingMode: { ideal: "environment" },
        };
        track.applyConstraints(constraints).catch(console.warn);
      }

      sceneEl.addEventListener("renderstart", () => {
        setTimeout(requestHighQualityCamera, 500);
        adjustVideoSize();

        // Play video when marker is detected
        target.addEventListener("targetFound", () =>
          video.play().catch(console.error)
        );
        target.addEventListener("targetLost", () => video.pause());

        // Smooth the video plane position & rotation
        sceneEl.addEventListener("tick", () => {
          if (!target.object3D.visible) return;

          // Interpolate position
          lastPosition.lerp(target.object3D.position, 0.2); // 0.2 = smoothing factor
          videoPlane.object3D.position.copy(lastPosition);

          // Interpolate rotation
          lastRotation.x += (target.object3D.rotation.x - lastRotation.x) * 0.2;
          lastRotation.y += (target.object3D.rotation.y - lastRotation.y) * 0.2;
          lastRotation.z += (target.object3D.rotation.z - lastRotation.z) * 0.2;
          videoPlane.object3D.rotation.copy(lastRotation);
        });
      });

      // Update video size after it starts playing
      video.addEventListener("play", adjustVideoSize);
    </script>
  </body>
</html>
