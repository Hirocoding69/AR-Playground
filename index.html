<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js Video on Marker</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam;">
      <!-- Marker -->
      <a-marker type="pattern" url="assets/500r.patt">
        <a-video
          src="#demo-video"
          width="2"
          height="1"
          rotation="-90 0 0"
          position="0 0 0"
          loop
        ></a-video>
      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>

      <!-- Assets -->
      <a-assets>
        <video
          id="demo-video"
          src="assets/vid.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          muted
          loop
        ></video>
      </a-assets>
    </a-scene>

    <script>
      const marker = document.querySelector("a-marker");
      const video = document.querySelector("#demo-video");

      marker.addEventListener("markerFound", () => {
        if (video.paused) video.play();
      });

      marker.addEventListener("markerLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
