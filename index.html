<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js Video on Marker</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.3.1/aframe/build/aframe-ar.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <!-- A-Frame Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Marker definition -->
      <a-marker preset="hiro">
        <!-- A plane to play the video -->
        <a-video
          src="#demo-video"
          width="2"
          height="1"
          rotation="-90 0 0"
          position="0 0 0"
          autoplay="true"
          loop="true"
        ></a-video>
      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>

      <!-- Video asset -->
      <a-assets>
        <video
          id="demo-video"
          src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r146/examples/textures/sintel.mp4"
          preload="auto"
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
          muted
        ></video>
      </a-assets>
    </a-scene>
  </body>
</html>
