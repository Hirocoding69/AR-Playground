<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Video Tracker</title>

    <!-- Three.js and MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      #phone-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        justify-content: center;
        align-items: center;
      }

      #phone-modal.show {
        display: flex;
      }

      .modal-content {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #333;
        text-align: center;
      }

      .modal-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .modal-input {
        padding: 0.75rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s;
      }

      .modal-input:focus {
        outline: none;
        border-color: #4a90e2;
      }

      .modal-button {
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .modal-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .modal-button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <!-- Phone Number Modal -->
    <div id="phone-modal">
      <div class="modal-content">
        <h2 class="modal-title">
          Enter your phone number to join the lucky draw
        </h2>
        <form class="modal-form" id="phone-form">
          <input
            type="tel"
            id="phone-input"
            class="modal-input"
            placeholder="Enter your phone number"
            required
            pattern="[0-9+\-\s()]+"
          />
          <button type="submit" class="modal-button">Submit</button>
        </form>
      </div>
    </div>

    <script>
      let mindarThree, container, scene, camera, renderer, videoMesh;
      let video, videoTexture;
      let isVideoPlaying = false;

      // Initialize MindAR
      async function init() {
        container = document.getElementById("container");

        // Create video element
        video = document.createElement("video");
        video.src = "assets/vid.mp4";
        video.playsInline = true;
        video.webkitPlaysInline = true;
        video.crossOrigin = "anonymous";
        video.preload = "auto";
        video.style.display = "none";
        document.body.appendChild(video);

        // Initialize MindAR
        mindarThree = new MindARThree.Target({
          container: container,
          imageTargetSrc: "assets/target.mind",
        });

        const {
          renderer: mindarRenderer,
          scene: mindarScene,
          camera: mindarCamera,
        } = mindarThree;

        scene = mindarScene;
        camera = mindarCamera;
        renderer = mindarRenderer;

        // Request higher quality camera
        requestHighQualityCamera();

        // Create video texture
        videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBFormat;

        // Create video plane
        const geometry = new THREE.PlaneGeometry(1, 0.5625); // 16:9 aspect ratio
        const material = new THREE.MeshBasicMaterial({
          map: videoTexture,
          side: THREE.DoubleSide,
        });
        videoMesh = new THREE.Mesh(geometry, material);
        videoMesh.visible = false;
        scene.add(videoMesh);

        // Adjust video size when metadata loads
        video.addEventListener("loadedmetadata", () => {
          adjustVideoSize();
        });

        // Handle target detection
        const anchor = mindarThree.addAnchor(0);
        anchor.onTargetFound = () => {
          console.log("Target found");
          videoMesh.visible = true;
          if (!isVideoPlaying) {
            video.play().catch((err) => console.error(err));
            isVideoPlaying = true;
          }
        };

        anchor.onTargetLost = () => {
          console.log("Target lost");
          video.pause();
        };

        // Show modal when video ends
        video.addEventListener("ended", () => {
          console.log("Video ended");
          showPhoneModal();
        });

        // Start MindAR
        await mindarThree.start();
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });
      }

      // Adjust video size to fit target while maintaining aspect ratio
      function adjustVideoSize() {
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          const videoAspectRatio = video.videoWidth / video.videoHeight;
          const targetSize = 1; // MindAR default target size is 1 unit

          console.log(
            `Video dimensions: ${video.videoWidth}x${
              video.videoHeight
            }, aspect ratio: ${videoAspectRatio.toFixed(3)}`
          );

          let width, height;
          if (videoAspectRatio > 1) {
            // Landscape video (like 1920x1080 = 16:9)
            width = targetSize;
            height = targetSize / videoAspectRatio;
          } else {
            // Portrait or square video
            width = targetSize * videoAspectRatio;
            height = targetSize;
          }

          videoMesh.geometry.dispose();
          videoMesh.geometry = new THREE.PlaneGeometry(width, height);
          console.log(
            `Set video plane to: ${width.toFixed(4)} x ${height.toFixed(4)}`
          );
        }
      }

      // Request higher quality camera
      function requestHighQualityCamera() {
        // Access the video stream from MindAR
        setTimeout(() => {
          const videoElement = mindarThree.video;
          if (videoElement && videoElement.srcObject) {
            const stream = videoElement.srcObject;
            if (stream && stream.getVideoTracks().length > 0) {
              const track = stream.getVideoTracks()[0];
              const capabilities = track.getCapabilities();

              const constraints = {
                width: { ideal: 1920, max: capabilities.width?.max || 1920 },
                height: { ideal: 1080, max: capabilities.height?.max || 1080 },
                frameRate: {
                  ideal: 60,
                  max: capabilities.frameRate?.max || 60,
                },
                facingMode: { ideal: "environment" },
              };

              track
                .applyConstraints(constraints)
                .then(() => {
                  console.log("Camera quality improved:", constraints);
                })
                .catch((err) => {
                  console.log("Could not apply camera constraints:", err);
                });
            }
          }
        }, 2000);
      }

      // Modal functionality
      const phoneModal = document.getElementById("phone-modal");
      const phoneForm = document.getElementById("phone-form");
      const phoneInput = document.getElementById("phone-input");

      function showPhoneModal() {
        phoneModal.classList.add("show");
        phoneInput.focus();
      }

      function hidePhoneModal() {
        phoneModal.classList.remove("show");
      }

      phoneForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const phoneNumber = phoneInput.value.trim();

        if (phoneNumber) {
          console.log("Phone number submitted:", phoneNumber);
          // Here you can add your API call to submit the phone number
          // For example: submitPhoneNumber(phoneNumber);

          alert(
            `Thank you! Your phone number ${phoneNumber} has been submitted.`
          );
          hidePhoneModal();
          phoneInput.value = "";
        }
      });

      // Close modal when clicking outside
      phoneModal.addEventListener("click", (e) => {
        if (e.target === phoneModal) {
          hidePhoneModal();
        }
      });

      // Start the application
      init().catch((err) => {
        console.error("Error initializing MindAR:", err);
      });
    </script>
  </body>
</html>
