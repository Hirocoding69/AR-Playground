<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Video Tracker</title>

    <!-- Correct A-Frame and MindAR versions -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      mindar-image="imageTargetSrc: assets/target.mind; uiScanning: false;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="demo-video"
          src="assets/vid.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
          muted
          loop
        ></video>
      </a-assets>

      <!-- Image Target (hidden, used only for tracking) -->
      <a-entity
        mindar-image-target="targetIndex: 0"
        id="target-entity"
      ></a-entity>

      <!-- Video wrapper that smoothly follows the target -->
      <a-entity
        id="video-wrapper"
        smooth-follow="target: #target-entity; factor: 0.12"
      >
        <a-video
          id="video-plane"
          src="#demo-video"
          width="2"
          height="1"
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

      <!-- MindAR Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const video = document.querySelector("#demo-video");
      const target = document.querySelector("[mindar-image-target]");
      const videoPlane = document.querySelector("#video-plane");
      const sceneEl = document.querySelector("a-scene");

      // Smoothing component that makes an entity smoothly follow a target
      AFRAME.registerComponent("smooth-follow", {
        schema: {
          target: { type: "selector" },
          factor: { type: "number", default: 0.12 }, // Lower = smoother but more lag
          minMovement: { type: "number", default: 0.001 }, // Ignore movements smaller than this
        },
        init: function () {
          this.targetWorldPos = new THREE.Vector3();
          this.targetWorldRot = new THREE.Quaternion();
          this.smoothedWorldPos = new THREE.Vector3();
          this.smoothedWorldRot = new THREE.Quaternion();
          this.isInitialized = false;
        },
        tick: function () {
          const targetEl = this.data.target;
          if (!targetEl || !targetEl.object3D || !this.el.object3D) return;

          // Get target's world transform
          targetEl.object3D.getWorldPosition(this.targetWorldPos);
          targetEl.object3D.getWorldQuaternion(this.targetWorldRot);

          // Initialize on first frame
          if (!this.isInitialized) {
            this.smoothedWorldPos.copy(this.targetWorldPos);
            this.smoothedWorldRot.copy(this.targetWorldRot);
            this.isInitialized = true;
            this.el.object3D.position.copy(this.smoothedWorldPos);
            this.el.object3D.quaternion.copy(this.smoothedWorldRot);
            return;
          }

          // Check if movement is significant enough to update
          const posDiff = this.targetWorldPos.distanceTo(this.smoothedWorldPos);
          const rotDiff = this.smoothedWorldRot.angleTo(this.targetWorldRot);

          // Only update if movement exceeds threshold (reduces micro-jitter)
          if (
            posDiff > this.data.minMovement ||
            rotDiff > this.data.minMovement
          ) {
            // Smooth interpolation
            const factor = this.data.factor;
            this.smoothedWorldPos.lerp(this.targetWorldPos, factor);
            this.smoothedWorldRot.slerp(this.targetWorldRot, factor);

            // Apply smoothed world transform directly (wrapper is a sibling, not a child)
            this.el.object3D.position.copy(this.smoothedWorldPos);
            this.el.object3D.quaternion.copy(this.smoothedWorldRot);
          }
        },
      });

      // Wait for MindAR to initialize
      sceneEl.addEventListener("renderstart", () => {
        // Play video when marker is detected
        target.addEventListener("targetFound", () => {
          console.log("Marker found");
          // Ensure video is ready before playing
          if (video.readyState >= 2) {
            video.play().catch((err) => console.error(err));
          } else {
            video.addEventListener(
              "loadeddata",
              () => {
                video.play().catch((err) => console.error(err));
              },
              { once: true }
            );
          }
        });

        // Pause video when marker is lost
        target.addEventListener("targetLost", () => {
          console.log("Marker lost");
          video.pause();
        });
      });

      // Preload and prepare video
      video.addEventListener("loadedmetadata", () => {
        video.currentTime = 0;
      });
    </script>
  </body>
</html>
