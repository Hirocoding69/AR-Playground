<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Optimized Video Tracking</title>

    <!-- Latest stable A-Frame + MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="
        imageTargetSrc: assets/target.mind;
        maxTrack: 1;
        filterMinCF: 0.001;
        filterBeta: 0.1;
        missTolerance: 10;
        warmupTolerance: 5;
        uiScanning: false;
      "
      color-space="sRGB"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <video
          id="demo-video"
          src="assets/vid.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
          muted
          loop
        ></video>
      </a-assets>

      <!-- Tracking Target -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="video-plane"
          src="#demo-video"
          width="2"
          height="1.125"
          16:9
          ratio
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

      <a-camera look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const video = document.querySelector("#demo-video");
      const target = document.querySelector("[mindar-image-target]");
      const sceneEl = document.querySelector("a-scene");

      // ✅ Ensures video texture updates every frame (VERY IMPORTANT)
      AFRAME.registerComponent("video-sync", {
        tick() {
          if (video.readyState >= 2 && !video.paused) {
            video.play().catch(() => {});
          }
        },
      });

      document.querySelector("#video-plane").setAttribute("video-sync", "");

      // ✅ Add autoplay fallback for mobile
      const startVideoSafely = () => {
        video.muted = true;
        const playAttempt = video.play();
        if (playAttempt) {
          playAttempt.catch(() => {
            console.warn("Autoplay blocked, waiting for user interaction");
            const resume = () => {
              video.play();
              window.removeEventListener("touchstart", resume);
              window.removeEventListener("click", resume);
            };
            window.addEventListener("touchstart", resume);
            window.addEventListener("click", resume);
          });
        }
      };

      sceneEl.addEventListener("renderstart", () => {
        startVideoSafely();

        // ✅ When marker is found
        target.addEventListener("targetFound", () => {
          console.log("✅ Marker found");
          video.play().catch((err) => console.error("Play failed:", err));
        });

        // ✅ When marker is lost (use small delay to avoid flicker)
        target.addEventListener("targetLost", () => {
          console.log("❌ Marker lost");
          setTimeout(() => {
            video.pause();
          }, 150);
        });
      });
    </script>
  </body>
</html>
