<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img
          id="display-image"
          src="assets/image.png"
          crossorigin="anonymous"
        />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-image
          src="#display-image"
          position="0 0 0"
          width="1"
          height="1"
          rotation="0 0 0"
        ></a-image>
      </a-entity>
    </a-scene>

    <script>
      const image = document.querySelector("#display-image");
      const imagePlane = document.querySelector("a-image");
      const sceneEl = document.querySelector("a-scene");

      // Adjust image size to maintain aspect ratio
      function adjustImageSize() {
        const updateSize = () => {
          if (image.naturalWidth > 0 && image.naturalHeight > 0) {
            const imageAspectRatio = image.naturalWidth / image.naturalHeight;
            const targetSize = 1;

            let width, height;
            if (imageAspectRatio > 1) {
              width = targetSize;
              height = targetSize / imageAspectRatio;
            } else {
              width = targetSize * imageAspectRatio;
              height = targetSize;
            }

            imagePlane.setAttribute("width", width);
            imagePlane.setAttribute("height", height);
          }
        };

        if (image.naturalWidth > 0 && image.naturalHeight > 0) {
          updateSize();
        } else {
          image.addEventListener("load", updateSize, { once: true });
        }
      }

      // Request higher quality camera for better tracking stability
      function requestHighQualityCamera() {
        const mindARSystem = sceneEl.systems["mindar-image-system"];
        if (mindARSystem && mindARSystem.video) {
          const stream = mindARSystem.video.srcObject;
          if (stream && stream.getVideoTracks().length > 0) {
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();

            const constraints = {
              width: { ideal: 1920, max: capabilities.width?.max || 1920 },
              height: { ideal: 1080, max: capabilities.height?.max || 1080 },
              frameRate: { ideal: 60, max: capabilities.frameRate?.max || 60 },
              facingMode: { ideal: "environment" },
            };

            track
              .applyConstraints(constraints)
              .then(() => {
                console.log("Camera quality improved for stable tracking");
              })
              .catch((err) => {
                console.log("Could not apply camera constraints:", err);
              });
          }
        }
      }

      // Initialize when scene is ready
      sceneEl.addEventListener("renderstart", () => {
        setTimeout(requestHighQualityCamera, 1000);
        adjustImageSize();
      });
    </script>
  </body>
</html>
