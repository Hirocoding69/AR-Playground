<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Video Tracker</title>

    <!-- Correct A-Frame and MindAR versions -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #phone-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        justify-content: center;
        align-items: center;
      }

      #phone-modal.show {
        display: flex;
      }

      .modal-content {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #333;
        text-align: center;
      }

      .modal-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .modal-input {
        padding: 0.75rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s;
      }

      .modal-input:focus {
        outline: none;
        border-color: #4a90e2;
      }

      .modal-button {
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .modal-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .modal-button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      mindar-image="imageTargetSrc: assets/target.mind; uiScanning: false;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="demo-video"
          src="assets/vid.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <!-- Image Target -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="video-plane"
          src="#demo-video"
          width="1"
          height="0.5625"
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

      <!-- MindAR Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <!-- Phone Number Modal -->
    <div id="phone-modal">
      <div class="modal-content">
        <h2 class="modal-title">
          Enter your phone number to join the lucky draw
        </h2>
        <form class="modal-form" id="phone-form">
          <input
            type="tel"
            id="phone-input"
            class="modal-input"
            placeholder="Enter your phone number"
            required
            pattern="[0-9+\-\s()]+"
          />
          <button type="submit" class="modal-button">Submit</button>
        </form>
      </div>
    </div>

    <script>
      const video = document.querySelector("#demo-video");
      const target = document.querySelector("[mindar-image-target]");
      const videoPlane = document.querySelector("#video-plane");
      const sceneEl = document.querySelector("a-scene");

      // Adjust video size to fit the target while maintaining aspect ratio
      function adjustVideoSize() {
        const updateSize = () => {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            const videoAspectRatio = video.videoWidth / video.videoHeight;
            const targetSize = 1; // MindAR default target size is 1 unit

            console.log(
              `Video dimensions: ${video.videoWidth}x${
                video.videoHeight
              }, aspect ratio: ${videoAspectRatio.toFixed(3)}`
            );

            // Fit video within target bounds, maintaining aspect ratio
            let width, height;
            if (videoAspectRatio > 1) {
              // Landscape video (like 1920x1080 = 16:9)
              width = targetSize;
              height = targetSize / videoAspectRatio;
            } else {
              // Portrait or square video
              width = targetSize * videoAspectRatio;
              height = targetSize;
            }

            videoPlane.setAttribute("width", width);
            videoPlane.setAttribute("height", height);
            console.log(
              `Set video plane to: ${width.toFixed(4)} x ${height.toFixed(4)}`
            );
          } else {
            console.log("Video dimensions not available yet");
          }
        };

        // Try immediately if dimensions are available
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          updateSize();
        } else {
          // Wait for metadata to load
          video.addEventListener("loadedmetadata", updateSize, { once: true });
          video.addEventListener("loadeddata", updateSize, { once: true });
          video.addEventListener("canplay", updateSize, { once: true });
        }
      }

      // Wait for MindAR to initialize
      sceneEl.addEventListener("renderstart", () => {
        adjustVideoSize();

        // Play video when marker is detected
        target.addEventListener("targetFound", () => {
          console.log("Marker found");
          video
            .play()
            .then(() => {
              // Update size again after video starts playing (dimensions might not be available until then)
              setTimeout(() => {
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                  const videoAspectRatio = video.videoWidth / video.videoHeight;
                  const targetSize = 1;

                  if (videoAspectRatio > 1) {
                    videoPlane.setAttribute("width", targetSize);
                    videoPlane.setAttribute(
                      "height",
                      targetSize / videoAspectRatio
                    );
                  } else {
                    videoPlane.setAttribute(
                      "width",
                      targetSize * videoAspectRatio
                    );
                    videoPlane.setAttribute("height", targetSize);
                  }
                  console.log(
                    `Updated video plane after play: ${video.videoWidth}x${video.videoHeight}`
                  );
                }
              }, 100);
            })
            .catch((err) => console.error(err));
        });

        // Pause video when marker is lost
        target.addEventListener("targetLost", () => {
          console.log("Marker lost");
          video.pause();
        });

        // Show modal when video ends
        video.addEventListener("ended", () => {
          console.log("Video ended");
          showPhoneModal();
        });
      });

      // Modal functionality
      const phoneModal = document.getElementById("phone-modal");
      const phoneForm = document.getElementById("phone-form");
      const phoneInput = document.getElementById("phone-input");

      function showPhoneModal() {
        phoneModal.classList.add("show");
        phoneInput.focus();
      }

      function hidePhoneModal() {
        phoneModal.classList.remove("show");
      }

      phoneForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const phoneNumber = phoneInput.value.trim();

        if (phoneNumber) {
          console.log("Phone number submitted:", phoneNumber);
          // Here you can add your API call to submit the phone number
          // For example: submitPhoneNumber(phoneNumber);

          alert(
            `Thank you! Your phone number ${phoneNumber} has been submitted.`
          );
          hidePhoneModal();
          phoneInput.value = "";
        }
      });

      // Close modal when clicking outside
      phoneModal.addEventListener("click", (e) => {
        if (e.target === phoneModal) {
          hidePhoneModal();
        }
      });
    </script>
  </body>
</html>
