<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: assets/target.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="demo-video"
          src="assets/vid.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="video-plane"
          src="#demo-video"
          position="0 0 0"
          width="1"
          height="0.5625"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector("#demo-video");
      const target = document.querySelector("[mindar-image-target]");
      const videoPlane = document.querySelector("#video-plane");
      const sceneEl = document.querySelector("a-scene");

      // Adjust video size to maintain aspect ratio
      function adjustVideoSize() {
        const updateSize = () => {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            const videoAspectRatio = video.videoWidth / video.videoHeight;
            const targetSize = 1;

            let width, height;
            if (videoAspectRatio > 1) {
              width = targetSize;
              height = targetSize / videoAspectRatio;
            } else {
              width = targetSize * videoAspectRatio;
              height = targetSize;
            }

            videoPlane.setAttribute("width", width);
            videoPlane.setAttribute("height", height);
          }
        };

        if (video.videoWidth > 0 && video.videoHeight > 0) {
          updateSize();
        } else {
          video.addEventListener("loadedmetadata", updateSize, { once: true });
          video.addEventListener("loadeddata", updateSize, { once: true });
          video.addEventListener("canplay", updateSize, { once: true });
        }
      }

      // Request higher quality camera for better tracking stability
      function requestHighQualityCamera() {
        const mindARSystem = sceneEl.systems["mindar-image-system"];
        if (mindARSystem && mindARSystem.video) {
          const stream = mindARSystem.video.srcObject;
          if (stream && stream.getVideoTracks().length > 0) {
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();

            const constraints = {
              width: { ideal: 1920, max: capabilities.width?.max || 1920 },
              height: { ideal: 1080, max: capabilities.height?.max || 1080 },
              frameRate: { ideal: 60, max: capabilities.frameRate?.max || 60 },
              facingMode: { ideal: "environment" },
            };

            track
              .applyConstraints(constraints)
              .then(() => {
                console.log("Camera quality improved for stable tracking");
              })
              .catch((err) => {
                console.log("Could not apply camera constraints:", err);
              });
          }
        }
      }

      // Initialize when scene is ready
      sceneEl.addEventListener("renderstart", () => {
        setTimeout(requestHighQualityCamera, 1000);
        adjustVideoSize();

        // Play video when marker is detected
        target.addEventListener("targetFound", () => {
          console.log("Marker found");
          video
            .play()
            .then(() => {
              // Update size again after video starts playing
              setTimeout(() => {
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                  const videoAspectRatio = video.videoWidth / video.videoHeight;
                  const targetSize = 1;

                  if (videoAspectRatio > 1) {
                    videoPlane.setAttribute("width", targetSize);
                    videoPlane.setAttribute(
                      "height",
                      targetSize / videoAspectRatio
                    );
                  } else {
                    videoPlane.setAttribute(
                      "width",
                      targetSize * videoAspectRatio
                    );
                    videoPlane.setAttribute("height", targetSize);
                  }
                }
              }, 100);
            })
            .catch((err) => console.error("Video play error:", err));
        });

        // Pause video when marker is lost
        target.addEventListener("targetLost", () => {
          console.log("Marker lost");
          video.pause();
        });
      });
    </script>
  </body>
</html>
